name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module:
    name: FHEM module and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check 74_NeatoLocal.pm
        run: perl tools/check_module.pl

      - name: Check the console simulator
        run: python3 tools/check_sim.py

      - name: Check the console dump tool
        run: python3 tools/check_dump.py

      - name: Check the partition table reader
        run: python3 tools/check_partition.py

      # Drives the real OTA client against a stand-in for the bridge. The
      # protocol is not ours, so this is the only check that says the module
      # speaks it -- including that the image arrives byte for byte.
      - name: Check the over-the-air update
        run: perl tools/check_ota.pl

      # Holds the session format and the coordinate convention against a real
      # recording -- the convention is measured there, not asserted.
      - name: Check the track and the map
        run: python3 tools/check_track.py

      # Not a test with an expected answer -- it reports what a recording
      # contains. It runs here so it keeps working: the negative result it
      # produced (tilt does not explain the stray points) is written down in
      # docs/ftui3-map.md, and a claim nobody can re-run is only an opinion.
      - name: Check the stray point report still runs
        run: python3 tools/stray_points.py docs/reference-track-botvac-d6.jsonl

      # The floor plan is a seam between two projects: this module computes it,
      # an FTUI component draws it, and a JSON file is all they share. This
      # builds the reference case from scratch and holds the result against
      # what the JavaScript implementation makes of the same three recordings.
      # It takes about a minute -- the search tries every rotation, which is
      # the whole point of doing it here rather than in a browser.
      - name: Check the floor plan against the reference case
        run: perl tools/check_plan.pl

  # One target, the same one the published image is built for. The ESP8266 is
  # gone: its single UART costs the console the sketch needs for setup and
  # diagnosis, and keeping a second platform alive meant a conditional at every
  # radio call -- which is where most of the bugs in this firmware came from.
  firmware:
    name: Bridge (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile neato_bridge
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - firmware/neato_bridge
          enable-warnings-report: true

  controls:
    name: Refresh the FHEM update index
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The index carries each module's size and a timestamp, and FHEM only
      # offers an update when they change. Doing it here means it can never be
      # forgotten. Its own commit carries [skip ci], so it does not retrigger
      # this workflow.
      - name: Regenerate controls_neatolocal.txt
        run: ./tools/make_controls.sh

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated files have no history worth merging: whatever this run
          # produced is the truth. Rebasing them invites content conflicts, and a
          # rebase that stops half way leaves the repository unable to even pull.
          # So the index is reset onto the latest main -- the working tree keeps
          # the freshly built files -- and only they are staged again.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main >/dev/null
            git add controls_neatolocal.txt
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "Update the FHEM update index [skip ci]" && git push && exit 0
            sleep 5
          done
          echo "could not push after three attempts"
          exit 1
