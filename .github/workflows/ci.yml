name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module:
    name: FHEM module and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check 74_NeatoLocal.pm
        run: perl tools/check_module.pl

      - name: Check the console simulator
        run: python3 tools/check_sim.py

      - name: Check the console dump tool
        run: python3 tools/check_dump.py

  firmware:
    name: Bridge (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C3
            fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M
            platform: esp32:esp32
            source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - name: ESP8266
            fqbn: esp8266:esp8266:nodemcuv2
            platform: esp8266:esp8266
            source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    steps:
      - uses: actions/checkout@v4

      - name: Compile neato_bridge
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: ${{ matrix.platform }}
              source-url: ${{ matrix.source-url }}
          sketch-paths: |
            - firmware/neato_bridge
          enable-warnings-report: true

  controls:
    name: Refresh the FHEM update index
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The index carries each module's size and a timestamp, and FHEM only
      # offers an update when they change. Doing it here means it can never be
      # forgotten. This job only ever writes controls_neatolocal.txt, which is
      # outside the paths that trigger it, so it cannot retrigger itself.
      - name: Regenerate controls_neatolocal.txt
        run: ./tools/make_controls.sh

      - name: Commit if it changed
        run: |
          if git diff --quiet -- controls_neatolocal.txt; then
            echo "index already matches the modules"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controls_neatolocal.txt
          git commit -m "Update the FHEM update index [skip ci]"
          git push
