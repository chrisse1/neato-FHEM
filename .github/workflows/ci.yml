name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module:
    name: FHEM module and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check 74_NeatoLocal.pm
        run: perl tools/check_module.pl

      - name: Check the console simulator
        run: python3 tools/check_sim.py

      - name: Check the console dump tool
        run: python3 tools/check_dump.py

  firmware:
    name: Bridge (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C3
            fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M
            platform: esp32:esp32
            source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - name: ESP8266
            fqbn: esp8266:esp8266:nodemcuv2
            platform: esp8266:esp8266
            source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    steps:
      - uses: actions/checkout@v4

      - name: Compile neato_bridge
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: ${{ matrix.platform }}
              source-url: ${{ matrix.source-url }}
          sketch-paths: |
            - firmware/neato_bridge
          enable-warnings-report: true

  # A single image that esptool can write to offset 0, so the FHEM module can
  # flash a board without an Arduino installation anywhere near it.
  image:
    name: Build the flashable ESP32-C3 image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FQBN: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          pip install --quiet esptool

      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" \
            --output-dir build firmware/neato_bridge

      - name: Merge bootloader, partitions and application
        run: |
          mkdir -p firmware/prebuilt
          boot_app0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -1)
          esptool.py --chip esp32c3 merge_bin \
            -o firmware/prebuilt/neato_bridge-esp32c3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0    build/neato_bridge.ino.bootloader.bin \
            0x8000 build/neato_bridge.ino.partitions.bin \
            0xe000 "$boot_app0" \
            0x10000 build/neato_bridge.ino.bin
          ls -l firmware/prebuilt/

      - name: Record what the image contains
        run: |
          version=$(grep -oP 'VERSION = "\K[^"]+' firmware/neato_bridge/neato_bridge.ino)
          {
            echo "neato_bridge $version"
            echo "board:  ESP32-C3 (fqbn $FQBN)"
            echo "built:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "commit: $GITHUB_SHA"
            echo "sha256: $(sha256sum firmware/prebuilt/neato_bridge-esp32c3.bin | cut -d' ' -f1)"
            echo
            echo "Write it to offset 0:"
            echo "  esptool.py --chip esp32c3 -p /dev/ttyACM0 write_flash 0x0 neato_bridge-esp32c3.bin"
          } > firmware/prebuilt/neato_bridge-esp32c3.txt
          cat firmware/prebuilt/neato_bridge-esp32c3.txt

      - name: Commit if the image changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/prebuilt/
          # Compared against the index, not the working tree: a file that is new
          # rather than modified does not appear in a plain diff at all, so the
          # first build would have reported "unchanged" and thrown the image away.
          if git diff --cached --quiet; then
            echo "image unchanged"
            exit 0
          fi
          git commit -m "Rebuild the flashable ESP32-C3 image [skip ci]"
          git push

  controls:
    name: Refresh the FHEM update index
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The index carries each module's size and a timestamp, and FHEM only
      # offers an update when they change. Doing it here means it can never be
      # forgotten. This job only ever writes controls_neatolocal.txt, which is
      # outside the paths that trigger it, so it cannot retrigger itself.
      - name: Regenerate controls_neatolocal.txt
        run: ./tools/make_controls.sh

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controls_neatolocal.txt
          if git diff --cached --quiet; then
            echo "index already matches the modules"
            exit 0
          fi
          git commit -m "Update the FHEM update index [skip ci]"
          git push
