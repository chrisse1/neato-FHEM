name: Firmware image

# The ESP32 build embeds its compile time in the application descriptor, so two
# builds of the same source are never byte identical. Rebuilding on every push
# would therefore add a megabyte to the repository each time -- hence the path
# filter: the image is rebuilt exactly when something it is made of changes.
#
# The partition reader belongs in that list: the metadata beside the image tells
# FHEM where the credentials block goes, and a fix to the reader that never
# reaches a rebuild leaves an image nobody can provision.
on:
  push:
    branches: [main]
    paths:
      - 'firmware/neato_bridge/**'
      - 'tools/partition_offset.py'
      - '.github/workflows/firmware-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build the flashable ESP32-C3 image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FQBN: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          pip install --quiet esptool

      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" \
            --output-dir build firmware/neato_bridge

      - name: Merge bootloader, partitions and application
        run: |
          mkdir -p firmware/prebuilt
          boot_app0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -1)
          esptool.py --chip esp32c3 merge_bin \
            -o firmware/prebuilt/neato_bridge-esp32c3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0    build/neato_bridge.ino.bootloader.bin \
            0x8000 build/neato_bridge.ino.partitions.bin \
            0xe000 "$boot_app0" \
            0x10000 build/neato_bridge.ino.bin

          # The application on its own, for updates over the air: those are
          # written into an app partition, so the merged image -- which starts
          # with the bootloader at offset 0 -- is exactly the wrong thing to
          # send. Two files for two jobs.
          cp build/neato_bridge.ino.bin \
             firmware/prebuilt/neato_bridge-esp32c3-app.bin
          ls -l firmware/prebuilt/

      - name: Record what the image contains
        run: |
          version=$(grep -oP 'VERSION = "\K[^"]+' firmware/neato_bridge/neato_bridge.ino)

          # Where a board gets its network handed to it at flash time. Read out
          # of the partition table that ships inside this very image, so the
          # two cannot drift apart.
          # Logged whatever happens: the layout decides where the credentials
          # block may be written, and it is not worth guessing at.
          python3 tools/partition_offset.py \
            build/neato_bridge.ino.partitions.bin --list
          seed=$(python3 tools/partition_offset.py \
                   build/neato_bridge.ino.partitions.bin \
                   spiffs,storage,littlefs,ffat)

          {
            echo "neato_bridge $version"
            echo "board:  ESP32-C3 (fqbn $FQBN)"
            echo "built:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "commit: $GITHUB_SHA"
            echo "sha256: $(sha256sum firmware/prebuilt/neato_bridge-esp32c3.bin | cut -d' ' -f1)"
            echo "seed offset: $seed"
            echo "app sha256: $(sha256sum firmware/prebuilt/neato_bridge-esp32c3-app.bin | cut -d' ' -f1)"
            echo
            echo "Write it to offset 0:"
            echo "  esptool.py --chip esp32c3 -p /dev/ttyACM0 write_flash 0x0 neato_bridge-esp32c3.bin"
            echo
            echo "The credentials block goes to $seed on its own; FHEM does that"
            echo "in the same pass with: set <device> flashESP \"<ssid>\" \"<password>\""
            echo
            echo "neato_bridge-esp32c3-app.bin is the same application without"
            echo "bootloader and partition table, for updates over the air:"
            echo "  set <device> otaESP"
          } > firmware/prebuilt/neato_bridge-esp32c3.txt
          cat firmware/prebuilt/neato_bridge-esp32c3.txt

      - name: Commit if the image changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated files have no history worth merging: whatever this run
          # produced is the truth. Rebasing them invites content conflicts, and a
          # rebase that stops half way leaves the repository unable to even pull.
          # So the index is reset onto the latest main -- the working tree keeps
          # the freshly built files -- and only they are staged again.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main >/dev/null
            git add firmware/prebuilt/
            if git diff --cached --quiet -- firmware/prebuilt/neato_bridge-esp32c3.bin \
                                             firmware/prebuilt/neato_bridge-esp32c3-app.bin; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "Rebuild the flashable ESP32-C3 image [skip ci]" && git push && exit 0
            sleep 5
          done
          echo "could not push after three attempts"
          exit 1
