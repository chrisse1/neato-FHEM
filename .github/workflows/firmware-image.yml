name: Firmware image

# The ESP32 build embeds its compile time in the application descriptor, so two
# builds of the same source are never byte identical. Rebuilding on every push
# would therefore add a megabyte to the repository each time -- hence the path
# filter: the image is rebuilt exactly when the sketch changes.
on:
  push:
    branches: [main]
    paths:
      - 'firmware/neato_bridge/**'
      - '.github/workflows/firmware-image.yml'

permissions:
  contents: read

jobs:
  image:
    name: Build the flashable ESP32-C3 image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FQBN: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          pip install --quiet esptool

      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" \
            --output-dir build firmware/neato_bridge

      - name: Merge bootloader, partitions and application
        run: |
          mkdir -p firmware/prebuilt
          boot_app0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -1)
          esptool.py --chip esp32c3 merge_bin \
            -o firmware/prebuilt/neato_bridge-esp32c3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0    build/neato_bridge.ino.bootloader.bin \
            0x8000 build/neato_bridge.ino.partitions.bin \
            0xe000 "$boot_app0" \
            0x10000 build/neato_bridge.ino.bin
          ls -l firmware/prebuilt/

      - name: Record what the image contains
        run: |
          version=$(grep -oP 'VERSION = "\K[^"]+' firmware/neato_bridge/neato_bridge.ino)
          {
            echo "neato_bridge $version"
            echo "board:  ESP32-C3 (fqbn $FQBN)"
            echo "built:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "commit: $GITHUB_SHA"
            echo "sha256: $(sha256sum firmware/prebuilt/neato_bridge-esp32c3.bin | cut -d' ' -f1)"
            echo
            echo "Write it to offset 0:"
            echo "  esptool.py --chip esp32c3 -p /dev/ttyACM0 write_flash 0x0 neato_bridge-esp32c3.bin"
          } > firmware/prebuilt/neato_bridge-esp32c3.txt
          cat firmware/prebuilt/neato_bridge-esp32c3.txt

      - name: Commit if the image changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the binary decides. Its companion file carries a build time and
          # a commit id and therefore differs on every run, so going by that
          # would add a commit to every push, firmware change or not.
          #
          # Compared against the index rather than the working tree, because a
          # file that is new instead of modified does not show up in a plain
          # diff at all -- which once made the very first build discard its
          # own image.
          git add firmware/prebuilt/neato_bridge-esp32c3.bin
          if git diff --cached --quiet; then
            echo "image unchanged"
            git checkout -- firmware/prebuilt/ 2>/dev/null || true
            exit 0
          fi
          git add firmware/prebuilt/
          git commit -m "Rebuild the flashable ESP32-C3 image [skip ci]"
          # The other auto-committing job pushes to main as well and may have
          # got there first, which would make this a non-fast-forward.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "could not push after three attempts"
          exit 1

